receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:8080
            - http://127.0.0.1:8080
            - http://localhost:5173
            - http://127.0.0.1:5173

exporters:
  mackerel_otlp: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [mackerel_otlp]
    logs:
      receivers: [otlp]
      exporters: [mackerel_otlp]
    metrics:
      receivers: [otlp]
      exporters: [mackerel_otlp]
